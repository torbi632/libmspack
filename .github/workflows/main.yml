name: Build libmspack

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

jobs:
  unix:
    name: Unix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            make

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install autoconf automake libtool pkg-config

      - name: Bootstrap and Build
        run: |
          cd libmspack
          chmod +x rebuild.sh
          ./rebuild.sh
          ./configure
          make -j2

      - name: Upload full folder
        uses: actions/upload-artifact@v4
        with:
          name: libmspack-${{ matrix.os }}-full
          if-no-files-found: error
          # 上传整个 libmspack 文件夹（包含源码、编译产物、生成的配置等所有内容）
          path: libmspack/

  windows:
    name: Windows (MSYS2 / MinGW64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            autoconf
            automake
            libtool
            make
            pkg-config
            git
            mingw-w64-x86_64-toolchain

      - name: Bootstrap and Build
        shell: msys2 {0}
        run: |
          cd libmspack
          # 防止 Windows 换行符导致脚本无法执行
          sed -i 's/\r$//' rebuild.sh cleanup.sh
          chmod +x rebuild.sh
          ./rebuild.sh
          ./configure
          make -j2

      - name: Upload full folder
        uses: actions/upload-artifact@v4
        with:
          name: libmspack-windows-full
          if-no-files-found: error
          # 上传整个 libmspack 文件夹
          path: libmspack/
