name: Build libmspack

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  unix:
    name: Unix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            autoconf \
            automake \
            libtool \
            make

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install autoconf automake libtool

      - name: Bootstrap from git
        run: |
          chmod +x rebuild.sh
          ./rebuild.sh

      - name: Configure
        run: ./configure

      - name: Build
        run: make -j2

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libmspack-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            **/*.a
            **/*.so*
            **/*.dylib
            **/*.la
            **/*.pc

  windows:
    name: Windows (MSYS2/MinGW64)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            autoconf
            automake
            libtool
            make
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-make

      - name: Build with winbuild.sh
        shell: msys2 {0}
        run: |
          sed -i 's/\r$//' winbuild.sh
          chmod +x winbuild.sh
          ./winbuild.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libmspack-windows
          if-no-files-found: ignore
          path: |
            **/*.a
            **/*.dll
            **/*.exe
            **/*.la
            **/*.pc
